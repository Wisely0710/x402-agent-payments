[project]
name = "x402-mcp-server"
version = "0.2.0"
description = "MCP server that lets AI agents pay for x402-protected resources with an EVM wallet"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "x402[httpx,evm]>=2.22",
    "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11,<2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" first so the local package wins over any installed copy; "." so that
# the tests can import examples.mock_seller.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Docs keep hand-formatted examples (ruff formats Python code fences in *.md,
# which turns a prose edit into a format failure).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous unicode" — they would flag every fullwidth
# punctuation mark in CJK comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src", "examples", "tests"]
explicit_package_bases = true
mypy_path = "src:../verifier"
ignore_missing_imports = true
